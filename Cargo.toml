[package]
name = "negiri"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A film negative scanning and RAW image editor"
repository = "https://github.com/jpttrssn/negiri"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
# Basic EXIF readout for the frame-info drawer (camera, ISO, shutter, aperture,
# focal length, lens, date, dimensions). Already in the lock via rawloader's
# tree, so `--locked` compiles nothing new.
kamadak-exif = "0.6.1"
# PNG encoding for lossless export (`png` feature only — the same image 0.25.10
# the tree already pulls for decode, so no new crates enter the lock).
image = { version = "0.25", default-features = false, features = ["png"] }
jpeg-encoder = "0.7"
# The logging facade only (no subscriber): a tiny stderr sink in `src/logging.rs`
# honors `RUST_LOG` and the `EXPOSURE_TRACE_*` knobs. Already vendored via
# libcosmic's tree, so `--locked`/`--frozen` compile nothing new.
log = "0.4"
# Direct `png` access for export so the master can tag a `pHYs` density chunk
# (`image::save_buffer_with_format` exposes no density API). Already in the lock
# via image 0.25 → png 0.18, so `--locked` compiles nothing new.
png = "0.18"
open = "5.3.2"
# The roll library root: `dirs::picture_dir()` resolves XDG_PICTURES_DIR on
# Linux, ~/Pictures on macOS, and FOLDERID_Pictures on Windows. Already in the
# lock via libcosmic's tree, so `--locked` compiles nothing new.
dirs = "6"
rawloader = "0.37.2"
rust-embed = "8.8.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8"
# Already vendored in Cargo.lock via libcosmic's tree, so `--locked`/`--frozen`
# compile nothing new; `FrameError` is `Clone` so it can ride `Message` payloads.
thiserror = "2"

[build-dependencies]
xdgen = "0.1"

[dev-dependencies]
# Already in the tree via wgpu; enables validating the WGSL at test time
# instead of at first launch (naga parses/validates it).
naga = "28"

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
pedantic = "warn"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../cosmic/libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
